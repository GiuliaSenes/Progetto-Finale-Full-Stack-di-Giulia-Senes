spring.application.name=charlotte-tattoo-api
server.port=8080

# Database H2 salvato su file (nella cartella backend/data): non serve installare nulla
spring.datasource.url=jdbc:h2:file:./data/charlotte;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Upload delle immagini (flash e immagini di riferimento)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=uploads

# JWT: in produzione il segreto va messo in una variabile d'ambiente (APP_JWT_SECRET)
app.jwt.secret=${APP_JWT_SECRET:cambia-questo-segreto-molto-lungo-di-almeno-32-caratteri}
app.jwt.expiration-hours=24

# Account della tatuatrice (admin) creato al primo avvio
app.admin.email=charlotte@charlottetattoo.it
app.admin.password=Charlotte2025!

# Quante richieste "in attesa" puo' avere un cliente nello stesso momento
app.max-pending-bookings=3
